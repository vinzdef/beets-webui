name: beets-webui

services:
  beets-webui:
    build: ../..
    image: beets-webui
    restart: unless-stopped
    ports:
      # No authentication yet, so only listen on the host's loopback by default.
      - "127.0.0.1:${WEBUI_PORT:-8338}:8338"
    volumes:
      - ${BEETS_CONFIG_DIR:-./config}:/config
      - ${MUSIC_DIR:-./music}:/music
      # Inboxes: folders the UI imports from. Each one also needs a name in config/config.yaml
      # under webui.inboxes, using its path inside the container.
      - ${INBOX_DIR:-./inbox}:/inbox
      # - ~/Downloads/music:/inboxes/downloads
