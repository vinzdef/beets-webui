[project]
name = "beets-webui"
version = "0.1.0"
description = "A web UI for the beets music library manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beets>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beetsplug"]
# The compiled frontend is gitignored but must ship in the wheel.
artifacts = ["src/beetsplug/webui/static/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
